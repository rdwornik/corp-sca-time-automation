# Tenrox timesheet mapping - SCA category -> Upland assignment row.
#
# Source of truth for the ASPX UpdateTimeEntries loader (src/tenrox.py).
# UIDs captured from the GetTimesheetDetails grid-load on 2026-07-05
# (user 23548, template 1119 "Spain (In/Out)"). Assignment rows are
# user-level and stable across weeks; TimesheetUid is per-week and read at
# run time from the grid-load response - it is NOT stored here.
#
# Business rules: HANDOFF Tenrox migration section 4 (delivered in-session
# 2026-07-05). This file is the durable in-repo form of section 4.2/4.3.

timesheet:
  user_unique_id: 23548          # userUniqueId / UserUid (bootstrap profile)
  template_uid: 1119
  template_name: "Spain (In/Out)"
  time_increment_minutes: 15

# One entry per Tenrox assignment row a time entry can post against.
# attribute_data is copied verbatim into the UpdateTimeEntries payload's
# AssignmentAttributeData object. seconds = hours * 3600 (RegularTime unit).
assignments:
  sales_activities:
    assignment_attribute_uid: 4823453
    task_uid: 435422
    work_type_name: "Sales Activities"
    project_name: "Exempt - Salary T00400"
