# SCA (pipeline/SharePoint) category -> assignment key + note rules.
# note_category (the first field of the note per section 4.1) is the SCA
# category string itself - e.g. "Discovery","OP-...","..." or "Conferences",
# NOT the Upland work-type name. requires_opid follows section 4.2 (sales).
# Multiple SCA categories can share one assignment; note_category keeps them
# distinct for the Amendment-1 idempotency identity.
category_map:
  # --- Sales (OPID required in note) ---
  "Discovery":                      {assignment: sales_activities, requires_opid: true}
  "Prep - Demo/ Presentation":      {assignment: sales_activities, requires_opid: true}
  "Customer - Demo/ Presentation":  {assignment: sales_activities, requires_opid: true}
  "Customer - Relationship Mgmt":   {assignment: sales_activities, requires_opid: true}
  "RFI/RFP/RFQ":                    {assignment: sales_activities, requires_opid: true}
  "POC":                            {assignment: sales_activities, requires_opid: true}
  # --- Overhead (no OPID) ---
  "Admin":                          {assignment: administration, requires_opid: false}
  "Internal Meeting":               {assignment: administration, requires_opid: false}
  "Conferences":                    {assignment: administration, requires_opid: false}
  "Training":                       {assignment: learning_and_development, requires_opid: false}
  "Support":                        {assignment: internal_project_support, requires_opid: false}
  "Template Build":                 {assignment: internal_project_support, requires_opid: false}
  "Travel":                         {assignment: travel_administration, requires_opid: false}
  # --- Non-working (loader skips; entered manually in the UI) ---
  "Time Off":                       {assignment: leave_time, requires_opid: false, skip: true}
